[project]
name = "pokerlost-service-template-tooling"
version = "0.2.0.dev0"
description = "Repository-local quality tooling for the Pokerlost service template."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "copier==9.17.2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "PyYAML>=6,<7",
    "mypy>=2.3,<2.4",
    "pre-commit==4.6.2",
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["tools"]
extend-exclude = ["_sources"]

[tool.ruff.per-file-target-version]
"tools/check_documentation.py" = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]
known-third-party = [
    "alembic",
    "fastapi",
    "logfire",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "typer",
    "uvicorn",
]
[tool.mypy]
python_version = "3.14"
files = ["tools"]
explicit_package_bases = true
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests", "tools/test_composition.py"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["tools"]
omit = ["*/tools/test_composition.py"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 0
precision = 2
show_missing = true

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"

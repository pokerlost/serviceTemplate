apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pokerlost.service.fullname" . }}
  labels:
    {{- include "pokerlost.service.labels" . | nindent 4 }}
  annotations:
    pokerlost.com/service-id: {{ .Values.serviceIdentity | quote }}
data:
  {{- range $name, $value := .Values.environment }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}

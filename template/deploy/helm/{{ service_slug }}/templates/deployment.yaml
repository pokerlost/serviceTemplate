apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pokerlost.service.fullname" . }}
  labels:
    {{- include "pokerlost.service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pokerlost.service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pokerlost.service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "pokerlost.service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - gunicorn
          args:
            - api.application:create_app()
            - --worker-class
            - uvicorn_worker.UvicornWorker
            - --bind
            - 0.0.0.0:{{ .Values.http.port }}
            - --workers
            - {{ .Values.gunicorn.workers | quote }}
            - --timeout
            - {{ .Values.gunicorn.timeout | quote }}
            - --graceful-timeout
            - {{ .Values.gunicorn.gracefulTimeout | quote }}
            - --keep-alive
            - {{ .Values.gunicorn.keepalive | quote }}
            - --forwarded-allow-ips
            - {{ .Values.gunicorn.forwardedAllowIps | quote }}
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
            - --capture-output
            - --worker-tmp-dir
            - /tmp
          envFrom:
            - configMapRef:
                name: {{ include "pokerlost.service.fullname" . }}
          {{- $enabledSecrets := dict }}
          {{- range $name, $secret := .Values.secretEnvironment }}
          {{- if $secret.enabled }}
          {{- $_ := set $enabledSecrets $name $secret }}
          {{- end }}
          {{- end }}
          {{- with $enabledSecrets }}
          env:
            {{- range $name, $secret := $enabledSecrets }}
            - name: {{ $name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "secretEnvironment.%s.name is required" $name) $secret.name }}
                  key: {{ required (printf "secretEnvironment.%s.key is required" $name) $secret.key }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

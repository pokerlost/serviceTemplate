repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deploy/helm/.*/templates/
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: env PYTHONPATH=app uv run --locked mypy
        language: system
        pass_filenames: false

      - id: documentation
        name: Documentation contract
        entry: uv run --locked python scripts/check_documentation.py
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|README\.md|SERVICE\.md|docs/.*\.md|scripts/check_documentation\.py)$

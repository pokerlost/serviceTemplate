repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: (^|/).*\.jinja$|^template/deploy/helm/.*/templates/
      - id: check-toml
        exclude: (^|/).*\.jinja$
      - id: check-json
        exclude: (^|/).*\.jinja$
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uvx --from ruff==0.16.4 ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uvx --from ruff==0.16.4 ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uvx --from 'mypy>=2.3,<2.4' mypy
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|template/scripts/.*\.py)$

      - id: root-documentation
        name: Root documentation contract
        entry: >-
          python3 template/scripts/check_documentation.py --documents
          README.md docs/index.md TEMPLATE.md CREATE_SERVICE.md SDK_COMPATIBILITY.md CHANGELOG.md AGENTS.md
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/index\.md|TEMPLATE\.md|CREATE_SERVICE\.md|SDK_COMPATIBILITY\.md|CHANGELOG\.md|AGENTS\.md|template/scripts/check_documentation\.py)$

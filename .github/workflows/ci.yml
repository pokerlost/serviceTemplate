name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./_sources/fastApiTemplate/template/.github/actions/actionlint
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: make check
      - name: Maintenance coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        persistence: [false, true]
        deployment: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run --locked python tools/compose_template.py --repo .
      - name: Render actual capabilities without private credentials
        env:
          PERSISTENCE: ${{ matrix.persistence }}
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          set -euo pipefail
          uv run --locked copier copy --defaults . "$RUNNER_TEMP/render" \
            -d service_name=verifyService -d withPersistence="$PERSISTENCE" \
            -d withDocker="$DEPLOYMENT" -d withKubernetes="$DEPLOYMENT"
          uv run --locked ruff check "$RUNNER_TEMP/render/src" "$RUNNER_TEMP/render/tests"
          uv run --locked ruff format --check "$RUNNER_TEMP/render/src" "$RUNNER_TEMP/render/tests"
          echo 'Private SDK runtime/image checks require the separately approved SDK-only App gate.' >> "$GITHUB_STEP_SUMMARY"

  required:
    if: always()
    needs: [maintain, render]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every available source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY

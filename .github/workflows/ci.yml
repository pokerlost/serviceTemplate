name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv run --no-project --python 3.14 make check
      - name: Verify pinned FastAPI source and render
        run: uv run --no-project --python 3.14 --with 'copier==9.17.2' python _sources/fastApiTemplate/tools/compose_template.py --repo . --smoke
      - name: Copier update regression
        run: uv run --no-project --python 3.14 --with 'copier==9.17.2' --with 'pytest>=9,<10' pytest -q tests

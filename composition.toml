templateVersion = "0.1.0.dev0"
answersSchema = 1
snapshot = "_sources/fastApiTemplate"
overlay = "foundationOverlay"
output = "composedTemplate"
include = [
  ".copier-answers.yml.jinja",
  ".editorconfig",
  ".gitignore",
  ".github/PULL_REQUEST_TEMPLATE.md.jinja",
  ".github/workflows/ci.yml.jinja",
  "AGENTS.md.jinja",
  "CONTRIBUTING.md.jinja",
  "PROJECT.md.jinja",
  "README.md.jinja",
  "Dockerfile.jinja",
  ".dockerignore",
  "SERVICE.md.jinja",
  "pyproject.toml.jinja",
  "_base/pyproject.toml.jinja",
  "docs/architecture.md.jinja",
  "src/{{ packageName }}/__init__.py.jinja",
  "src/{{ packageName }}/py.typed",
  "src/{{ packageName }}/api/__init__.py",
  "src/{{ packageName }}/api/health.py.jinja",
  "src/{{ packageName }}/app.py.jinja",
  "src/{{ packageName }}/errors.py.jinja",
  "src/{{ packageName }}/resources.py.jinja",
  "src/{{ packageName }}/settings.py.jinja",
  "src/{{ packageName }}/persistence.py.jinja",
  "alembic.ini.jinja",
  "migrations/env.py.jinja",
  "migrations/versions/.gitkeep",
  "tests/test_http.py.jinja",
  "tests/database_integration.py.jinja",
]
allowOverride = [
  "AGENTS.md.jinja",
  "README.md.jinja",
  "SERVICE.md.jinja",
  "pyproject.toml.jinja",
  "docs/architecture.md.jinja",
  ".github/workflows/ci.yml.jinja",
  "src/{{ packageName }}/app.py.jinja",
  "src/{{ packageName }}/errors.py.jinja",
  "tests/test_http.py.jinja",
  "Dockerfile.jinja",
  ".dockerignore",
]
retainBase = { "pyproject.toml.jinja" = "_base/fastApiPyproject.toml.jinja", "src/{{ packageName }}/app.py.jinja" = "_base/fastApiApp.py.jinja", "src/{{ packageName }}/errors.py.jinja" = "_base/fastApiErrors.py.jinja" }
smokeAnswers = { service_name = "sampleService" }
